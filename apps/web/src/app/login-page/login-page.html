<main>
  <article>
    <p><a routerLink="/">&larr; Back to all bears</a></p>

    <font size="6">Log in</font>

    @if (errorMessage(); as message) {
      <p class="error-message">{{ message }}</p>
    }
    <form class="comment-form" (submit)="onSubmit($event)">
      <div class="flex-pair">
        <label for="login-email">E-mail:</label>
        <input
          type="email"
          name="email"
          id="login-email"
          autocomplete="username"
          required
          maxlength="254"
          [value]="email()"
          (input)="onEmailInput($event)"
        />
      </div>
      <div class="flex-pair">
        <label for="login-password">Password:</label>
        <input
          type="password"
          name="password"
          id="login-password"
          autocomplete="current-password"
          required
          maxlength="128"
          [value]="password()"
          (input)="onPasswordInput($event)"
        />
      </div>
      <div>
        <input type="submit" value="Log in" [disabled]="submitting()" />
      </div>
    </form>
    <p>No account yet? <a routerLink="/register">Register</a></p>
  </article>
</main>
