<font size="6">Comments</font>
<ul class="comment-container">
  @for (comment of comments(); track comment.id) {
    <li>
      <p>{{ comment.author }}</p>
      <p>{{ comment.text }}</p>
      @if (user() !== null) {
        <button type="button" (click)="reported.emit(comment.id)">
          Report ({{ comment.reportCount }})
        </button>
      }
      @if (canDelete(comment)) {
        <button type="button" (click)="deleted.emit(comment.id)">Delete</button>
      }
    </li>
  }
</ul>
