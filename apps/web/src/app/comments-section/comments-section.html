<section class="comments">
  <app-comment-toggle
    [expanded]="commentsExpanded()"
    (toggled)="onToggleComments()"
  />

  <div
    class="comment-wrapper"
    [style.display]="commentsExpanded() ? 'block' : 'none'"
  >
    @if (errorMessage(); as message) {
      <p class="error-message">{{ message }}</p>
    }
    @if (auth.user() !== null) {
      <app-comment-form (submitted)="onAddComment($event)" />
    } @else {
      <p><a routerLink="/login">Log in</a> to write or report comments.</p>
    }
    <app-comment-list
      [comments]="comments()"
      [user]="auth.user()"
      (deleted)="onDeleteComment($event)"
      (reported)="onReportComment($event)"
    />
    @if (nextCursor() !== null) {
      <button type="button" [disabled]="loadingMore()" (click)="onLoadMore()">
        {{ loadingMore() ? 'Loading...' : 'Load more comments' }}
      </button>
    }
  </div>
</section>
