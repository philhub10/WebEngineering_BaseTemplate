services:
  api:
    build: ./apps/api
    environment:
      PORT: "3000"
      WIKIPEDIA_BASE_URL: https://en.wikipedia.org
      USER_AGENT: BearApp/0.1 (https://github.com/philhub10/WebEngineering_BaseTemplate; philhub10@gmail.com)
      CORS_ORIGINS: http://localhost:4173
    ports: ["3000:3000"]
  web:
    build: ./apps/web
    ports: ["8080:80"]
    depends_on: [api]
