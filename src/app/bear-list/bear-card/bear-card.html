<div class="bear">
  <a [routerLink]="['/bears', bear().name]">
    <img
      [src]="bear().image"
      [alt]="'Image of ' + bear().name"
      style="width: 200px; height: auto"
    />
    <p>
      <b>{{ bear().name }}</b> ({{ bear().binomial }})
    </p>
  </a>
  <p>Range: {{ bear().range }}</p>
</div>
