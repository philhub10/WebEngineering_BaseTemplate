<font size="6">Add comment</font>
<form class="comment-form" (submit)="onSubmit($event)">
  <div class="flex-pair">
    Your name:
    <input
      type="text"
      name="name"
      id="name"
      placeholder="Enter your name"
      required
      [value]="name()"
      (input)="onNameInput($event)"
    />
  </div>
  <div class="flex-pair">
    Your comment:
    <input
      type="text"
      name="comment"
      id="comment"
      placeholder="Enter your comment"
      required
      [value]="text()"
      (input)="onTextInput($event)"
    />
  </div>
  <div>
    <input type="submit" value="Submit comment" />
  </div>
</form>
